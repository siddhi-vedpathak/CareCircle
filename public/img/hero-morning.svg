<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" fill="none">
  <defs>
    <linearGradient id="mornSky" x1="0" y1="0" x2="0" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="45%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="400" height="180" rx="24" fill="url(#mornSky)"/>

  <!-- Sun with warm aura -->
  <circle cx="280" cy="70" r="48" fill="#FDE68A" fill-opacity="0.5"/>
  <circle cx="280" cy="70" r="32" fill="#F59E0B"/>
  <circle cx="280" cy="70" r="24" fill="#FBBF24"/>

  <!-- Distant Birds -->
  <path d="M70 42 Q76 36 82 42 Q88 36 94 42" stroke="#B45309" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M102 54 Q107 49 112 54 Q117 49 122 54" stroke="#B45309" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M50 62 Q54 58 58 62 Q62 58 66 62" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Back Warm Hills -->
  <path d="M-20 180 Q60 110 160 130 T360 120 Q390 125 420 140 L420 180 Z" fill="url(#hillBack)" fill-opacity="0.55"/>

  <!-- Mid Green Rolling Hills -->
  <path d="M-10 180 Q80 130 190 150 Q280 130 410 165 L410 180 Z" fill="url(#hillMid)" fill-opacity="0.8"/>

  <!-- Front Verdant Valley -->
  <path d="M-20 180 Q90 148 200 168 Q310 145 420 172 L420 180 Z" fill="url(#hillFront)"/>

  <!-- Stylized rounded morning trees -->
  <g opacity="0.9">
    <path d="M48 165 L48 152" stroke="#1E3A8A" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="48" cy="144" rx="10" ry="14" fill="#059669"/>
    <ellipse cx="46" cy="142" rx="7" ry="10" fill="#10B981"/>

    <path d="M68 170 L68 158" stroke="#1E3A8A" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="68" cy="150" rx="13" ry="17" fill="#047857"/>
    <ellipse cx="66" cy="148" rx="9" ry="12" fill="#059669"/>

    <path d="M340 168 L340 156" stroke="#1E3A8A" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="340" cy="148" rx="11" ry="15" fill="#059669"/>

    <path d="M362 172 L362 160" stroke="#1E3A8A" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="362" cy="152" rx="14" ry="18" fill="#047857"/>
  </g>
</svg>
