<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <defs>
    <linearGradient id="noApptBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="calGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="240" height="160" rx="24" fill="url(#noApptBg)"/>

  <!-- Soft shadow table base -->
  <path d="M20 135 C70 132 170 132 220 135 C170 142 70 142 20 135 Z" fill="#BFDBFE" fill-opacity="0.6"/>

  <!-- Relaxed Calendar Card -->
  <g transform="translate(42, 28)">
    <rect x="0" y="0" width="76" height="86" rx="14" fill="url(#calGrad)" stroke="#93C5FD" stroke-width="2"/>
    <!-- Top banner -->
    <path d="M0 14 C0 6.268 6.268 0 14 0 H62 C69.732 0 76 6.268 76 14 V24 H0 Z" fill="#3B82F6"/>
    <!-- Calendar rings -->
    <rect x="18" y="-4" width="6" height="8" rx="3" fill="#1E40AF"/>
    <rect x="52" y="-4" width="6" height="8" rx="3" fill="#1E40AF"/>
    <!-- Big smiling sun / checkmark inside calendar -->
    <circle cx="38" cy="54" r="18" fill="#FEF3C7"/>
    <circle cx="38" cy="54" r="14" fill="#FCD34D"/>
    <!-- Checkmark on today -->
    <path d="M31 54 L36 59 L46 48" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Warm Indian Chai Cup (Clay Kulhad / Ceramic cup) -->
  <g transform="translate(132, 48)">
    <!-- Steam Swirls -->
    <path d="M26 12 Q24 0 28 -8 Q32 -16 28 -24" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" fill="none" opacity="0.7"/>
    <path d="M38 10 Q42 -2 36 -10 Q32 -18 38 -26" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" fill="none" opacity="0.7"/>
    
    <!-- Cup Body -->
    <path d="M12 24 L16 68 Q18 76 28 76 L42 76 Q52 76 54 68 L58 24 Z" fill="#EA580C" stroke="#C2410C" stroke-width="2" stroke-linejoin="round"/>
    <!-- Cup Band Pattern -->
    <path d="M14 36 H56" stroke="#FDBA74" stroke-width="3" stroke-linecap="round"/>
    <!-- Chai Liquid -->
    <ellipse cx="35" cy="24" rx="23" ry="6" fill="#D97706"/>
    <!-- Handle -->
    <path d="M56 32 C68 32 68 56 54 58" stroke="#C2410C" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Reading Glasses resting gently -->
  <g transform="translate(85, 110)">
    <circle cx="16" cy="12" r="10" stroke="#475569" stroke-width="2.5" fill="#F8FAFC" fill-opacity="0.8"/>
    <circle cx="44" cy="12" r="10" stroke="#475569" stroke-width="2.5" fill="#F8FAFC" fill-opacity="0.8"/>
    <path d="M26 12 Q30 8 34 12" stroke="#475569" stroke-width="2.5" fill="none"/>
    <path d="M6 12 L0 8" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M54 12 L60 8" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
