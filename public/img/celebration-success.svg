<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 180" fill="none">
  <defs>
    <linearGradient id="celebBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
  </defs>

  <rect width="260" height="180" rx="28" fill="url(#celebBg)"/>

  <!-- Confetti ribbons & stars -->
  <g>
    <!-- Stars -->
    <path d="M40 30 L42 36 L48 38 L42 40 L40 46 L38 40 L32 38 L38 36 Z" fill="#F59E0B"/>
    <path d="M220 35 L222 40 L227 41.5 L222 43 L220 48 L218 43 L213 41.5 L218 40 Z" fill="#10B981"/>
    <path d="M30 110 L31.5 114 L35.5 115.5 L31.5 117 L30 121 L28.5 117 L24.5 115.5 L28.5 114 Z" fill="#F26B5B"/>
    <path d="M230 115 L231.5 119 L235.5 120.5 L231.5 122 L230 126 L228.5 122 L224.5 120.5 L228.5 119 Z" fill="#3B82F6"/>

    <!-- Ribbons -->
    <path d="M50 70 Q60 60 70 75 T90 65" stroke="#F26B5B" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M190 75 Q180 65 170 80 T150 70" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M80 135 Q95 125 110 138" stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M165 130 Q175 140 190 128" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Big Central Gold Trophy / Heart Badge -->
  <g transform="translate(95, 35)">
    <!-- Big warm heart badge -->
    <circle cx="35" cy="40" r="36" fill="#10B981"/>
    <circle cx="35" cy="40" r="31" fill="#FFFFFF"/>
    <!-- Big Green Heart -->
    <path d="M35 32 C30 22 18 22 15 31 C11 41 23 51 35 62 C47 51 59 41 55 31 C52 22 40 22 35 32 Z" fill="#10B981"/>
    <!-- Checkmark inside heart -->
    <path d="M27 41 L33 47 L43 36" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Happy family member clapping / thumbs up small avatars on sides -->
  <g transform="translate(45, 80)">
    <circle cx="16" cy="16" r="14" fill="#FCD34D"/>
    <!-- Smile -->
    <path d="M10 16 Q16 22 22 16" stroke="#1F2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="12" cy="12" r="1.8" fill="#1F2937"/>
    <circle cx="20" cy="12" r="1.8" fill="#1F2937"/>
  </g>

  <g transform="translate(185, 80)">
    <circle cx="16" cy="16" r="14" fill="#FCD34D"/>
    <!-- Smile -->
    <path d="M10 16 Q16 22 22 16" stroke="#1F2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="12" cy="12" r="1.8" fill="#1F2937"/>
    <circle cx="20" cy="12" r="1.8" fill="#1F2937"/>
  </g>
