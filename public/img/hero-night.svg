<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" fill="none">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="nightHillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="nightHillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Deep Navy Sky -->
  <rect width="400" height="180" rx="24" fill="url(#nightSky)"/>

  <!-- Stars & Constellations -->
  <g fill="#F8FAFC">
    <circle cx="45" cy="35" r="1.8" fill-opacity="0.9"/>
    <circle cx="85" cy="55" r="1.4" fill-opacity="0.7"/>
    <circle cx="130" cy="30" r="2.2" fill-opacity="0.95"/>
    <circle cx="170" cy="65" r="1.5" fill-opacity="0.8"/>
    <circle cx="210" cy="38" r="1.7" fill-opacity="0.75"/>
    <circle cx="250" cy="75" r="1.3" fill-opacity="0.7"/>
    <circle cx="340" cy="40" r="2.0" fill-opacity="0.9"/>
    <circle cx="375" cy="65" r="1.6" fill-opacity="0.8"/>
    <!-- Star sparkle -->
    <path d="M130 24 L132 29 L137 31 L132 33 L130 38 L128 33 L123 31 L128 29 Z" fill="#FDE047" fill-opacity="0.85"/>
    <path d="M340 34 L341.5 38 L345.5 39.5 L341.5 41 L340 45 L338.5 41 L334.5 39.5 L338.5 38 Z" fill="#FDE047" fill-opacity="0.75"/>
  </g>

  <!-- Gentle Crescent Moon with Warm Glow -->
  <g transform="translate(285, 30)">
    <circle cx="25" cy="25" r="32" fill="#FDE047" fill-opacity="0.2"/>
    <circle cx="25" cy="25" r="24" fill="#FEF08A"/>
    <circle cx="32" cy="20" r="22" fill="#141E30"/>
    <circle cx="32" cy="20" r="22" fill="url(#nightSky)"/>
  </g>

  <!-- Distant Serene Hills -->
  <path d="M-20 180 Q80 130 180 145 T380 138 L420 180 Z" fill="url(#nightHillBack)" fill-opacity="0.6"/>

  <!-- Front Peaceful Hills -->
  <path d="M-20 180 Q100 148 210 168 Q310 145 420 172 L420 180 Z" fill="url(#nightHillFront)"/>

  <!-- Silhouetted Night Trees -->
  <g opacity="0.85">
    <path d="M60 168 L60 156" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="60" cy="148" rx="10" ry="14" fill="#0F172A"/>

    <path d="M78 172 L78 160" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="78" cy="152" rx="13" ry="17" fill="#090D16"/>

    <path d="M330 170 L330 158" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="330" cy="150" rx="12" ry="16" fill="#090D16"/>
  </g>
</svg>
