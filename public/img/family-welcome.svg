<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" fill="none">
  <defs>
    <linearGradient id="famGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#EBF7F0"/>
    </linearGradient>
  </defs>

  <!-- Background Aura -->
  <rect width="280" height="180" rx="30" fill="url(#famGlow)"/>

  <!-- Grandfather (Ajoba) - Far Left -->
  <g transform="translate(30, 40)">
    <circle cx="25" cy="30" r="18" fill="#FCD34D"/>
    <path d="M7 30 Q6 14 25 14 Q44 14 43 30 Z" fill="#CBD5E1"/>
    <!-- Glasses -->
    <circle cx="19" cy="28" r="5" stroke="#1F2937" stroke-width="2" fill="none"/>
    <circle cx="31" cy="28" r="5" stroke="#1F2937" stroke-width="2" fill="none"/>
    <line x1="24" y1="28" x2="26" y2="28" stroke="#1F2937" stroke-width="2"/>
    <!-- Body -->
    <path d="M10 56 Q25 48 40 56 L42 105 L8 105 Z" fill="#2E7D5B"/>
  </g>

  <!-- Grandmother (Ajji) - Center Left -->
  <g transform="translate(85, 42)">
    <circle cx="25" cy="28" r="18" fill="#FCD34D"/>
    <path d="M8 28 Q7 13 25 13 Q43 13 42 28 Z" fill="#94A3B8"/>
    <circle cx="25" cy="8" r="7" fill="#64748B"/>
    <circle cx="25" cy="22" r="2" fill="#DC2626"/> <!-- Bindi -->
    <!-- Eyes and smile -->
    <path d="M16 28 Q20 25 24 28" stroke="#1F2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M26 28 Q30 25 34 28" stroke="#1F2937" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M21 34 Q25 38 29 34" stroke="#92400E" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- Body Saree -->
    <path d="M10 54 Q25 46 40 54 L42 103 L8 103 Z" fill="#F26B5B"/>
  </g>

  <!-- Caregiver Son/Daughter - Center Right -->
  <g transform="translate(145, 36)">
    <circle cx="25" cy="26" r="17" fill="#FCD34D"/>
    <!-- Hair -->
    <path d="M8 26 Q7 10 25 10 Q43 10 42 26 Z" fill="#1F2937"/>
    <!-- Face -->
    <circle cx="19" cy="25" r="2" fill="#1F2937"/>
    <circle cx="31" cy="25" r="2" fill="#1F2937"/>
    <path d="M20 31 Q25 35 30 31" stroke="#92400E" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Body -->
    <path d="M10 52 Q25 44 40 52 L43 109 L7 109 Z" fill="#3B82F6"/>
  </g>

  <!-- Grandson (Aarav) - Front Right -->
  <g transform="translate(205, 58)">
    <circle cx="20" cy="24" r="15" fill="#FCD34D"/>
    <!-- Young hair -->
    <path d="M5 24 Q5 10 20 10 Q35 10 35 24 Z" fill="#78350F"/>
    <!-- Big joyful eyes -->
    <circle cx="15" cy="23" r="2" fill="#1F2937"/>
    <circle cx="25" cy="23" r="2" fill="#1F2937"/>
    <path d="M15 28 Q20 33 25 28" stroke="#92400E" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Body -->
    <path d="M8 46 Q20 40 32 46 L34 87 L6 87 Z" fill="#F59E0B"/>
    <!-- Waving hand with heart -->
    <path d="M32 50 Q42 42 45 35" stroke="#FCD34D" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Floating Heart of Care above -->
  <g transform="translate(125, 12)">
    <path d="M15 15 C12 8 4 8 2 14 C-1 21 7 28 15 36 C23 28 31 21 28 14 C26 8 18 8 15 15 Z" fill="#F26B5B"/>
  </g>
</svg>
