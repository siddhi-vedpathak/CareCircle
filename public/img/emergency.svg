<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 180" fill="none">
  <defs>
    <linearGradient id="emBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="100%" stop-color="#FEE2E2"/>
    </linearGradient>
    <linearGradient id="emShieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="emPhoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>

  <!-- Background rounded card -->
  <rect width="260" height="180" rx="28" fill="url(#emBg)"/>

  <!-- Protective Radiating Pulse Rings -->
  <circle cx="130" cy="85" r="70" stroke="#FCA5A5" stroke-width="2" stroke-dasharray="6 4" fill="none" opacity="0.45"/>
  <circle cx="130" cy="85" r="54" stroke="#F87171" stroke-width="2.5" fill="none" opacity="0.6"/>

  <!-- Big Central Protective Shield -->
  <g transform="translate(92, 38)">
    <path d="M38 0 C58 0 76 10 76 28 C76 62 48 84 38 92 C28 84 0 62 0 28 C0 10 18 0 38 0 Z" fill="url(#emShieldGrad)"/>
    
    <!-- Inner White Shield Border -->
    <path d="M38 6 C53 6 68 14 68 29 C68 57 46 76 38 83 C30 76 8 57 8 29 C8 14 23 6 38 6 Z" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.4"/>

    <!-- Reassuring Medical Plus Cross -->
    <rect x="33" y="24" width="10" height="34" rx="4" fill="#FFFFFF"/>
    <rect x="21" y="36" width="34" height="10" rx="4" fill="#FFFFFF"/>

    <!-- Gentle caring heart badge in center of cross -->
    <circle cx="38" cy="41" r="7" fill="#FEE2E2"/>
    <path d="M38 39 C36.5 37 33.5 37 32 39 C30.5 41 34 44 38 47 C42 44 45.5 41 44 39 C42.5 37 39.5 37 38 39 Z" fill="#DC2626"/>
  </g>

  <!-- Left: One-Touch Call Phone Receiver -->
  <g transform="translate(34, 75)">
    <circle cx="22" cy="22" r="22" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2"/>
    <path d="M14 17 C14 24 20 30 27 30 L29 27 C30 25.5 29.5 24 28 23.5 L25 22.5 C24 22 23 22.5 22.5 23.5 L22 24.5 C18.5 23 17 21.5 15.5 18 L16.5 17.5 C17.5 17 18 16 17.5 15 L16.5 12 C16 10.5 14.5 10 13 11 L10 13 C10 14.5 12.5 17 14 17 Z" fill="#DC2626"/>
    <!-- Sound Waves -->
    <path d="M34 14 C37 17 37 23 34 26" stroke="#EF4444" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Right: Indian Family Care Icon / Stethoscope Badge -->
  <g transform="translate(182, 75)">
    <circle cx="22" cy="22" r="22" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2"/>
    <!-- Stethoscope / Care loop -->
    <path d="M14 13 V20 C14 25 18 29 23 29 C28 29 32 25 32 20 V13" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="14" cy="13" r="2.5" fill="#DC2626"/>
    <circle cx="32" cy="13" r="2.5" fill="#DC2626"/>
    <path d="M23 29 V33" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="23" cy="34" r="3.5" fill="#DC2626"/>
  </g>
</svg>
