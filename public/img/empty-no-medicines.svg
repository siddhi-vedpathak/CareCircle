<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <defs>
    <linearGradient id="emptyMedBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
  </defs>

  <rect width="240" height="160" rx="24" fill="url(#emptyMedBg)"/>

  <!-- Calm water glass -->
  <g transform="translate(65, 30)">
    <path d="M12 25 L18 85 Q19 92 26 92 L44 92 Q51 92 52 85 L58 25 Z" fill="#E0F2FE" stroke="#38BDF8" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Water level -->
    <path d="M15 45 Q35 48 55 45 L52 85 Q51 90 45 90 L25 90 Q19 90 18 85 Z" fill="#BAE6FD" fill-opacity="0.8"/>
    <!-- Water reflections -->
    <path d="M22 55 L20 78" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Flower in small vase next to it -->
  <g transform="translate(130, 38)">
    <!-- Stem -->
    <path d="M20 50 Q24 25 32 15" stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M22 36 Q12 32 10 24 Q18 24 22 34" fill="#34D399"/>
    <!-- Daisy Flower -->
    <g transform="translate(32, 14)">
      <circle cx="0" cy="-8" r="5" fill="#FDE68A"/>
      <circle cx="8" cy="-4" r="5" fill="#FDE68A"/>
      <circle cx="8" cy="4" r="5" fill="#FDE68A"/>
      <circle cx="0" cy="8" r="5" fill="#FDE68A"/>
      <circle cx="-8" cy="4" r="5" fill="#FDE68A"/>
      <circle cx="-8" cy="-4" r="5" fill="#FDE68A"/>
      <circle cx="0" cy="0" r="5.5" fill="#F59E0B"/>
    </g>
    <!-- Rounded Vase -->
    <path d="M10 50 L30 50 L36 82 Q37 87 31 87 L9 87 Q3 87 4 82 Z" fill="#FDE68A" stroke="#F59E0B" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Checkmark shield badge -->
  <g transform="translate(165, 95)">
    <circle cx="20" cy="20" r="18" fill="#10B981"/>
    <path d="M13 20 L18 25 L27 15" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
